server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Bundles carry a content hash in the filename, so a given name never
    # changes contents. Screenshots do change, but only via a re-capture that
    # also rebuilds the image, so the same reasoning holds.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # cleanUrls writes links as /cx/matrix while the file on disk is
        # /cx/matrix.html. Without the $uri.html arm every internal link 404s.
        # Note this is deliberately NOT an SPA fallback: a missing page must
        # return 404, not silently render the home page.
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
