# Logs readers in directly against Zitadel, so any active user of any org gets
# in, and an existing Zitadel session from an instance login is reused.
# The client secret and cookie secret come from the exto-docs-oauth2 Secret.
provider = "oidc"
provider_display_name = "Exto"
oidc_issuer_url = "https://id.exto360.com"
client_id = "393934985091899366"
redirect_url = "https://docs.exto360.com/oauth2/callback"

upstreams = ["http://127.0.0.1:80/"]
http_address = "0.0.0.0:4180"
reverse_proxy = true
silence_ping_logging = true

scope = "openid profile email offline_access"
code_challenge_method = "S256"

# Zitadel's login decides who gets in, not email verification.
email_domains = ["*"]
insecure_oidc_allow_unverified_email = true

# The hourly refresh is what ends access for a user deactivated in Console.
# session_cookie_minimal would drop the refresh token, so it stays off.
cookie_name = "_exto_docs"
cookie_secure = true
cookie_samesite = "lax"
cookie_refresh = "1h"
cookie_expire = "24h"

skip_provider_button = false
custom_templates_dir = "/etc/oauth2-proxy"

# Never set pass_access_token or set_xauthrequest: this app shares a Zitadel
# project, so the token audience can carry other client IDs that exto-go would
# accept.
