apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: exto-docs
  namespace: exto-docs
  labels:
    app.exto/component: docs
    app.kubernetes.io/instance: exto-docs
    app.kubernetes.io/name: exto
spec:
  hostnames:
    - docs.exto360.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: exto-gateway
      namespace: nginx-gateway
  rules:
    # Everything goes to oauth2-proxy, never straight to nginx: the Service's
    # port maps to the proxy, which serves /oauth2/* and gates the rest.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: exto-docs
          port: 80
          weight: 1
