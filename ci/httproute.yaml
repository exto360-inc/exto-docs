# Its own route rather than another rule on lab-us-route-01/02: those are
# hand-edited, and a separate object can be applied from CI without touching
# anyone else's paths.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab-us-docs
  namespace: lab-us
  labels:
    app.exto/component: docs
    app.kubernetes.io/instance: lab-us
    app.kubernetes.io/name: exto
spec:
  hostnames:
    - lab-us.exto360.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: exto-gateway
      namespace: nginx-gateway
  rules:
    # VitePress is built with base /docs/ and its router only recognises the
    # home page with the slash; /docs alone would hydrate into the 404 page.
    - matches:
        - path:
            type: Exact
            value: /docs
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /docs/
            statusCode: 302
    # The prefix is kept, unlike the other lab-us services: oauth2-proxy's own
    # paths live under /docs/oauth2, and nginx serves the site under /docs/.
    - matches:
        - path:
            type: PathPrefix
            value: /docs/
      backendRefs:
        - group: ""
          kind: Service
          name: exto-docs-lab-us
          port: 80
          weight: 1
