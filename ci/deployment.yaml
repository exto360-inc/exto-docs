apiVersion: apps/v1
kind: Deployment
metadata:
  # Sits beside the rest of the lab-us environment and follows its naming:
  # <service>-lab-us, with the same app.kubernetes.io labels.
  name: exto-docs-lab-us
  namespace: lab-us
  labels:
    app.exto/component: docs
    app.kubernetes.io/instance: lab-us
    app.kubernetes.io/name: exto
spec:
  replicas: 1
  selector:
    matchLabels:
      app.exto/component: docs
      app.kubernetes.io/instance: lab-us
      app.kubernetes.io/name: exto
  template:
    metadata:
      labels:
        app.exto/component: docs
        app.kubernetes.io/instance: lab-us
        app.kubernetes.io/name: exto
    spec:
      imagePullSecrets:
        - name: lab-us-pull-secret
      containers:
        - name: exto-docs
          image: gaeadev.azurecr.io/exto-docs:latest
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # Static files out of nginx. The whole site is in the image, so this
          # needs far less than the app containers do.
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: exto-docs-lab-us
  namespace: lab-us
  labels:
    app.exto/component: docs
    app.kubernetes.io/instance: lab-us
    app.kubernetes.io/name: exto
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.exto/component: docs
    app.kubernetes.io/instance: lab-us
    app.kubernetes.io/name: exto
