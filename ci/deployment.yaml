apiVersion: apps/v1
kind: Deployment
metadata:
  # Sits beside the rest of the lab-us environment and follows its naming:
  # <service>-lab-us, with the same app.kubernetes.io labels.
  name: exto-docs-lab-us
  namespace: lab-us
  labels:
    app.exto/component: docs
    app.kubernetes.io/instance: lab-us
    app.kubernetes.io/name: exto
spec:
  replicas: 1
  selector:
    matchLabels:
      app.exto/component: docs
      app.kubernetes.io/instance: lab-us
      app.kubernetes.io/name: exto
  template:
    metadata:
      labels:
        app.exto/component: docs
        app.kubernetes.io/instance: lab-us
        app.kubernetes.io/name: exto
    spec:
      imagePullSecrets:
        - name: lab-us-pull-secret
      containers:
        # Every request enters here: it serves the sign-in page until the
        # reader has a session, then proxies to nginx in the same pod. The
        # session lives in a cookie sealed with the shared cookie secret, so
        # any replica can serve any reader.
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          args:
            - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: exto-docs-oauth2
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: exto-docs-oauth2
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          volumeMounts:
            - name: oauth2-proxy
              mountPath: /etc/oauth2-proxy
              readOnly: true
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
        - name: exto-docs
          image: gaeadev.azurecr.io/exto-docs:latest
          ports:
            - name: nginx
              containerPort: 80
              protocol: TCP
          # Static files out of nginx. The whole site is in the image, so this
          # needs far less than the app containers do.
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            tcpSocket:
              port: nginx
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /docs/index.html
              port: nginx
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: oauth2-proxy
          configMap:
            name: exto-docs-oauth2-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: exto-docs-lab-us
  namespace: lab-us
  labels:
    app.exto/component: docs
    app.kubernetes.io/instance: lab-us
    app.kubernetes.io/name: exto
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.exto/component: docs
    app.kubernetes.io/instance: lab-us
    app.kubernetes.io/name: exto
